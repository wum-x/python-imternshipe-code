<!DOCTYPE html>
<html>
<head>
    <title>CSS Icons</title>

    <!-- Font Awesome icon library -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        /* Page styling */
        body {
            background-color: #f2f2f2;
            text-align: center;
            padding-top: 100px;
        }

        /* Icon container */
        .icons {
            display: flex;
            justify-content: center;
            gap: 40px;
        }

        /* Common icon style */
        .icons i {
            font-size: 50px;
            cursor: pointer;
            transition: 0.3s;
        }

        /* Home icon */
        .home {
            color: blue;
        }

        /* User icon */
        .user {
            color: green;
        }

        /* Heart icon */
        .heart {
            color: red;
        }

        /* Search icon */
        .search {
            color: orange;
        }

        /* Hover animation */
        .icons i:hover {
            transform: scale(1.3);
        }
    </style>
</head>

<body>

    <h1>CSS Icons</h1>

    <div class="icons">

        <!-- Home icon -->
        <i class="fa-solid fa-house home"></i>

        <!-- User icon -->
        <i class="fa-solid fa-user user"></i>

        <!-- Heart icon -->
        <i class="fa-solid fa-heart heart"></i>

        <!-- Search icon -->
        <i class="fa-solid fa-magnifying-glass search"></i>

    </div>

</body>
</html>
